<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page non trouvée | Sadaa</title>
    <meta name="description" content="La page que vous recherchez n'existe pas sur Sadaa.">
    <meta name="robots" content="noindex, follow">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-primary: #C99B35;
            --color-primary-dark: #B08A2D;
            --bg-dark: #0F0F0F;
            --bg-card: #1A1A1A;
            --bg-hover: #252525;
            --text-primary: #F9FAFB;
            --text-secondary: #9CA3AF;
            --border-color: #2D2D2D;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
        }
        
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }
        
        .logo {
            font-family: 'Noto Naskh Arabic', serif;
            font-size: 5rem;
            color: var(--color-primary);
            margin-bottom: 1rem;
            font-weight: 700;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            color: var(--color-primary);
            opacity: 0.3;
            line-height: 1;
            margin-bottom: 1rem;
        }
        
        .error-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }
        
        .error-desc {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: var(--color-primary);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .btn:hover {
            background: var(--color-primary-dark);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">صَــدَى</div>
        <div class="error-code">404</div>
        <h1 class="error-title">Page non trouvée</h1>
        <p class="error-desc">
            La page que vous recherchez semble avoir disparu dans le silence.<br>
            Retournez à l'accueil pour continuer votre voyage spirituel.
        </p>
        <a href="/" class="btn">
            <span>←</span> Retour à l'accueil
        </a>
    </div>
</body>
</html>
